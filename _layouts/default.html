<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  {% assign description = page.excerpt | strip_html | normalize_whitespace | strip %}
  <meta name="description" content="{% if description != "" %}{{ description | truncate: 160 | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23888'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
