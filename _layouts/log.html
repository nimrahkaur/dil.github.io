---
layout: default
---
<article class="log">
  <time class="log-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%b %-d, %Y" }}</time>
  <div class="log-body">
    <h1 class="log-title">{{ page.title | escape }}</h1>
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
